# Dedicated directories, never the Compose data directories. Provision them
# manually before the first sync; local volumes do not create missing paths.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: foodie-postgres
  annotations:
    argocd.argoproj.io/sync-wave: '-20'
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  capacity: { storage: 20Gi }
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ''
  claimRef: { namespace: foodie, name: postgres }
  local: { path: /var/lib/foodie/postgres }
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - { key: kubernetes.io/hostname, operator: In, values: [sebastian] }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres
  annotations:
    argocd.argoproj.io/sync-wave: '-20'
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ''
  volumeName: foodie-postgres
  resources: { requests: { storage: 20Gi } }
---
