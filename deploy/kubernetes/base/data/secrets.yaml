apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: onepassword
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
spec:
  controller: foodie
  provider:
    onepasswordSDK:
      vault: foodie-production
      auth:
        serviceAccountSecretRef:
          name: onepassword-service-account
          key: token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: foodie
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: SecretStore, name: onepassword }
  target:
    name: foodie
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
    - secretKey: DATABASE_URL
      remoteRef: { key: DATABASE_URL/password }
    - secretKey: POSTGRES_DB
      remoteRef: { key: POSTGRES_DB/password }
    - secretKey: POSTGRES_USER
      remoteRef: { key: POSTGRES_USER/password }
    - secretKey: POSTGRES_PASSWORD
      remoteRef: { key: POSTGRES_PASSWORD/password }
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef: { key: GOOGLE_CLIENT_ID/password }
    - secretKey: GOOGLE_CLIENT_SECRET
      remoteRef: { key: GOOGLE_CLIENT_SECRET/password }
    - secretKey: AWS_USER
      remoteRef: { key: AWS_USER/password }
    - secretKey: AWS_PASSWORD
      remoteRef: { key: AWS_PASSWORD/password }
    - secretKey: ALLOWED_MAILS
      remoteRef: { key: ALLOWED_MAILS/password }
    - secretKey: REDIS_URL
      remoteRef: { key: REDIS_URL/password }
    - secretKey: REDIS_PASSWORD
      remoteRef: { key: REDIS_PASSWORD/password }
