apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: { app: redis }
  ports:
    - { name: redis, port: 6379, targetPort: redis }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      terminationGracePeriodSeconds: 60
      containers:
        - name: redis
          image: redis@sha256:0c341492924cad6f5483f9133e43bd6c51ecdecbcadfac5b51657393b6a7936c
          command: [sh, -ec]
          args:
            # Private ephemeral config keeps the password out of argv. exec
            # makes Redis PID 1 so SIGTERM saves RDB before shutdown.
            # Match the source's RDB persistence for the initial migration.
            - |
              umask 077
              escaped_password="$(printf '%s' "$REDIS_PASSWORD" | sed 's/\\/\\\\/g; s/"/\\"/g')"
              { printf 'requirepass "%s"\n' "$escaped_password";
                printf 'dir /data\nsave 60 1\nappendonly no\n';
              } > /tmp/redis.conf
              exec redis-server /tmp/redis.conf
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: foodie, key: REDIS_PASSWORD } }
            - name: REDISCLI_AUTH
              valueFrom: { secretKeyRef: { name: foodie, key: REDIS_PASSWORD } }
          ports:
            - { name: redis, containerPort: 6379 }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 256Mi }
          startupProbe:
            exec: { command: [sh, -ec, 'test "$(redis-cli ping)" = PONG'] }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec: { command: [sh, -ec, 'test "$(redis-cli ping)" = PONG'] }
          livenessProbe:
            exec: { command: [sh, -ec, 'test "$(redis-cli ping)" = PONG'] }
            periodSeconds: 20
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: redis }
        - name: tmp
          emptyDir: { sizeLimit: 8Mi }
