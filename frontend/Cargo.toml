[package]
name = "frontend"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
common = { path = "../common"}
anyhow = "1.0.104"
leptos = { version = "0.7.8", features = ["nightly", "csr"] }
leptos_router = { version = "0.7.8" }
leptos_meta = "0.7.8"
leptos-use = "0.15.10"
codee = "0.3.5"
reqwasm = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
serde_json = "1.0.154"
web-sys = { version = "0.3.107", features = ["Event", "HtmlElement", "Document", "File", "FileList", "Location"] }
chrono = { version = "0.4.45", features = ["serde"] }
console_error_panic_hook = "0.1.7"
rust_decimal = "1.43.0"
num = "0.4.3"
uuid = { version = "1.29.0", features = ["v4", "rng-getrandom"]}
getrandom = { version = "0.4.3", features = ["wasm_js"]}
thaw = { version = "0.4.8", features = ["csr", "nightly"] }
icondata = "0.6.0"
thaw_utils = { version = "0.1.2", features = ["csr", "nightly"] }
