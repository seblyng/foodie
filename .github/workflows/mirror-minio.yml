name: Mirror legacy MinIO
on:
  workflow_dispatch:

permissions:
  # Reading draft release assets requires repository push access.
  contents: write
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Download preserved source image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p /tmp/minio
          gh release download minio-source-2025-09-07 \
            --pattern foodie-minio-source.tar.gz --dir /tmp/minio
          echo '040526791160975e4fc20cd156b9bf3aec3a71e00f435c4d8e5940cb57edee98  /tmp/minio/foodie-minio-source.tar.gz' | sha256sum --check
          gzip -dc /tmp/minio/foodie-minio-source.tar.gz | docker load
          test "$(docker image inspect quay.io/minio/minio --format '{{.Id}}')" = \
            'sha256:69b2ec208575b69597784255eec6fa6a2985ee9e1a47f4411a51f7f5fdd193a9'
          docker run --rm --network none --entrypoint minio quay.io/minio/minio --version
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish exact legacy image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/foodie-minio:RELEASE.2025-09-07T16-13-09Z"
          docker tag quay.io/minio/minio "$image"
          docker push "$image"
          docker image inspect "$image" --format '{{json .RepoDigests}}' \
            | jq -r '.[] | select(startswith("ghcr.io/"))' > /tmp/minio-reference.txt
      - uses: actions/upload-artifact@v4
        with:
          name: minio-reference
          path: /tmp/minio-reference.txt
