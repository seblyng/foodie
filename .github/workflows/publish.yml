name: Publish release
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: publish-production
  cancel-in-progress: false

jobs:
  images:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend, migration]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: config
        env:
          COMPONENT: ${{ matrix.component }}
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "image=ghcr.io/${OWNER,,}/foodie-${COMPONENT}" >> "$GITHUB_OUTPUT"
          case "$COMPONENT" in
            backend) file=backend/.docker/Dockerfile.prod ;;
            frontend) file=frontend/.docker/Dockerfile.prod ;;
            migration) file=backend/.docker/Dockerfile.migrations.prod ;;
          esac
          echo "file=$file" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: ${{ steps.config.outputs.file }}
          platforms: linux/amd64
          build-args: CADDYFILE=frontend/.docker/Caddyfile.kubernetes
          push: true
          tags: ${{ steps.config.outputs.image }}:sha-${{ github.event.workflow_run.head_sha }}
          labels: org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Record immutable image reference
        env:
          COMPONENT: ${{ matrix.component }}
          IMAGE: ${{ steps.config.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/release
          echo "$IMAGE@$DIGEST" > "/tmp/release/$COMPONENT.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.component }}
          path: /tmp/release/*.txt

  release-pr:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Reject a superseded application build
        env:
          RELEASE: ${{ github.event.workflow_run.head_sha }}
        run: |
          git diff --quiet "$RELEASE" HEAD -- backend frontend common .github scripts .docker .dockerignore
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          merge-multiple: true
          path: /tmp/release
      - uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: '5.8.3'
      - name: Update production image digests
        working-directory: deploy/kubernetes/overlays/production
        run: |
          kustomize edit set image \
            "foodie-backend=$(</tmp/release/backend.txt)" \
            "foodie-frontend=$(</tmp/release/frontend.txt)" \
            "foodie-migration=$(</tmp/release/migration.txt)"
      - name: Validate release manifests
        run: |
          kustomize build deploy/kubernetes/overlays/production > /tmp/production.yaml
          docker run --rm -v /tmp:/manifests:ro \
            ghcr.io/yannh/kubeconform:v0.7.0@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c \
            -strict -summary -ignore-missing-schemas /manifests/production.yaml
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: release/production
          title: 'deploy: release ${{ github.event.workflow_run.head_sha }}'
          commit-message: 'deploy: update production image digests'
          body: 'Deploys images built from ${{ github.event.workflow_run.head_sha }}'
          add-paths: deploy/kubernetes/overlays/production/kustomization.yaml
